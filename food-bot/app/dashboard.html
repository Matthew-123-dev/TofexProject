<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tofex Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Primary Logo Colors */
      --tofex-crimson: #8B1113;
      --tofex-amber: #DC8529;
      --tofex-white: #FFFFFF;

      /* Secondary & Campaign Colors */
      --tofex-burgundy: #681015;
      --tofex-terracotta: #B84D24;
      --tofex-blaze-orange: #E8630A;
      --tofex-challenge-gold: #F9E511;

      /* Neutrals & Frosted Glass Surfaces */
      --tofex-charcoal: #181514;
      --tofex-espresso: #4A423F;
      --tofex-frost-bg: rgba(245, 236, 228, 0.72);
      --tofex-frost-border: rgba(255, 255, 255, 0.45);

      /* Derived Surface & UI Tokens */
      --canvas: #F6F2EE;
      --muted-ink: #7A706B;
      --line: rgba(74, 66, 63, 0.12);
      --card-shadow: 0 2px 10px rgba(24, 21, 20, 0.06);
      --card-shadow-hover: 0 10px 26px rgba(104, 16, 21, 0.10);
      --green: #1D7A47;
      --green-bg: #E6F5EC;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--tofex-charcoal);
      background:
        radial-gradient(circle at 12% 0%, rgba(220, 133, 41, 0.14), transparent 40%),
        radial-gradient(circle at 92% 14%, rgba(139, 17, 19, 0.10), transparent 38%),
        var(--canvas);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }

    a { color: inherit; text-decoration: none; }

    /* App Shell */
    .shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100dvh;
    }

    /* Desktop Sidebar */
    aside.sidebar {
      position: sticky;
      top: 0;
      height: 100dvh;
      padding: 26px 18px 22px;
      background: linear-gradient(180deg, var(--tofex-charcoal) 0%, #241918 100%);
      color: var(--tofex-white);
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--tofex-crimson), var(--tofex-blaze-orange));
      border: 1px solid var(--tofex-frost-border);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 19px;
      color: var(--tofex-white);
      box-shadow: 0 8px 20px rgba(139, 17, 19, 0.4);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--tofex-amber);
      margin-top: 2px;
    }

    .side-nav {
      display: grid;
      gap: 6px;
      margin-top: 34px;
    }

    .side-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.72);
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }

    .side-nav a:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tofex-white);
    }

    .side-nav a.active {
      background: linear-gradient(90deg, rgba(139, 17, 19, 0.92), rgba(184, 77, 36, 0.85));
      color: var(--tofex-white);
      box-shadow: inset 3px 0 0 var(--tofex-challenge-gold), 0 6px 16px rgba(139, 17, 19, 0.35);
    }

    .side-nav .nav-badge {
      margin-left: auto;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 99px;
      background: var(--tofex-challenge-gold);
      color: var(--tofex-charcoal);
      font-size: 11px;
      font-weight: 800;
      display: inline-grid;
      place-items: center;
    }

    .side-footer {
      margin-top: auto;
      display: grid;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .side-btn {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--tofex-white);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .side-btn:hover { background: rgba(255, 255, 255, 0.14); }

    /* Mobile Top Header Bar (Figma Home Header) */
    .mobile-header {
      display: none;
    }

    /* Main Content Container */
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 32px 48px;
    }

    /* Curved Subpage Hero Banner on Mobile / Sleek Header on Desktop */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow-light {
      color: var(--tofex-crimson);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .page-header h1 {
      margin: 4px 0 4px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--tofex-charcoal);
    }

    .muted {
      color: var(--tofex-espresso);
      opacity: 0.78;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Figma Rounded Pill Search Bar */
    .search-wrap {
      margin-bottom: 18px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--tofex-white);
      border: 1px solid rgba(74, 66, 63, 0.12);
      border-radius: 13px;
      padding: 0 14px;
      min-height: 44px;
      box-shadow: var(--card-shadow);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-bar:focus-within {
      border-color: var(--tofex-crimson);
      box-shadow: 0 0 0 3px rgba(139, 17, 19, 0.12);
    }

    .search-bar input {
      border: 0;
      background: transparent;
      padding: 10px 0;
      width: 100%;
      font-size: 15px;
      color: var(--tofex-charcoal);
      box-shadow: none !important;
    }

    .search-bar input::placeholder { color: #9C918B; }
    .search-clear {
      border: 0;
      background: rgba(74, 66, 63, 0.08);
      color: var(--tofex-espresso);
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 99px;
      display: grid;
      place-items: center;
      font-size: 14px;
      cursor: pointer;
    }

    /* Filter Chips (Horizontal scrollable on mobile) */
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 99px;
      border: 1px solid rgba(74, 66, 63, 0.14);
      background: var(--tofex-white);
      color: var(--tofex-espresso);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--tofex-crimson);
      border-color: var(--tofex-crimson);
      color: var(--tofex-white);
      box-shadow: 0 6px 14px rgba(139, 17, 19, 0.24);
    }

    .chip-count {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(74, 66, 63, 0.10);
      color: inherit;
    }
    .chip.active .chip-count {
      background: rgba(255, 255, 255, 0.22);
      color: var(--tofex-white);
    }

    /* Figma Hero Gradient Carousel (28px / 22px rounded banners + dot indicator) */
    .hero-carousel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      padding: 20px 22px;
      color: var(--tofex-white);
      min-height: 144px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(104, 16, 21, 0.22);
    }

    .hero-card.primary-grad {
      background: linear-gradient(124deg, var(--tofex-crimson) 6%, var(--tofex-terracotta) 62%, var(--tofex-amber) 108%);
    }

    .hero-card.secondary-grad {
      background: linear-gradient(124deg, var(--tofex-burgundy) 8%, var(--tofex-blaze-orange) 74%, var(--tofex-amber) 110%);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -28px;
      top: -28px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      pointer-events: none;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      right: 26px;
      bottom: -44px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(249, 229, 17, 0.16);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(8px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero-pill.gold {
      background: var(--tofex-challenge-gold);
      color: var(--tofex-charcoal);
    }

    .hero-card h2 {
      margin: 10px 0 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    .hero-card p {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.90);
      max-width: 34ch;
      position: relative;
      z-index: 1;
    }

    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--tofex-white);
      position: relative;
      z-index: 1;
    }

    .carousel-dots {
      display: none;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(74, 66, 63, 0.22);
      transition: all 0.2s ease;
    }
    .dot.active {
      width: 20px;
      background: var(--tofex-crimson);
    }

    /* Stats Strip (Figma Horizontal Cards on Mobile / 4-col Grid on Desktop) */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0 6px;
    }

    .stat-card {
      background: var(--tofex-white);
      border: 1px solid rgba(74, 66, 63, 0.08);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow-hover);
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(220, 133, 41, 0.14);
      color: var(--tofex-terracotta);
    }

    .stat-icon.crimson {
      background: rgba(139, 17, 19, 0.11);
      color: var(--tofex-crimson);
    }

    .stat-icon.green {
      background: var(--green-bg);
      color: var(--green);
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-ink);
    }

    .stat-val {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--tofex-charcoal);
      line-height: 1.1;
    }

    /* Section Headings (Figma "Section Title + See All >") */
    .section {
      margin-top: 26px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--tofex-charcoal);
    }

    .section-head p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted-ink);
    }

    .see-all {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--tofex-crimson);
      white-space: nowrap;
      padding: 4px 0;
    }

    /* Card Grids & Frosted Panels */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }

    .panel {
      background: var(--tofex-white);
      border: 1px solid rgba(74, 66, 63, 0.09);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--card-shadow);
    }

    .frost-panel {
      background: var(--tofex-frost-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--tofex-frost-border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--card-shadow);
    }

    /* Figma List / Order Cards */
    .card {
      background: var(--tofex-white);
      border: 1px solid rgba(74, 66, 63, 0.09);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card.urgent {
      border-color: rgba(139, 17, 19, 0.30);
      box-shadow: 0 6px 20px rgba(139, 17, 19, 0.10);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-thumb {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
      background: rgba(220, 133, 41, 0.14);
      color: var(--tofex-terracotta);
    }

    .card-thumb.crimson {
      background: rgba(139, 17, 19, 0.11);
      color: var(--tofex-crimson);
    }

    .card-thumb.orange {
      background: rgba(232, 99, 10, 0.13);
      color: var(--tofex-blaze-orange);
    }

    .card-thumb.green {
      background: var(--green-bg);
      color: var(--green);
    }

    .card-title-group {
      flex: 1;
      min-width: 0;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--tofex-charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted-ink);
      margin-top: 2px;
      word-break: break-word;
    }

    .card-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 11px;
      background: #FAF6F2;
    }

    .card-price-row strong {
      font-size: 16px;
      font-weight: 800;
      color: var(--tofex-charcoal);
    }

    .card-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-ink);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      text-transform: capitalize;
      white-space: nowrap;
      background: rgba(220, 133, 41, 0.15);
      color: var(--tofex-terracotta);
    }

    .badge.green { background: var(--green-bg); color: var(--green); }
    .badge.crimson, .badge.red { background: rgba(139, 17, 19, 0.11); color: var(--tofex-crimson); }
    .badge.orange { background: rgba(232, 99, 10, 0.14); color: var(--tofex-blaze-orange); }
    .badge.gold { background: var(--tofex-challenge-gold); color: var(--tofex-charcoal); }
    .badge.muted-pill { background: rgba(74, 66, 63, 0.09); color: var(--tofex-espresso); }

    /* Order Items */
    .order-items {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .order-items li {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(245, 236, 228, 0.55);
      border: 1px solid rgba(74, 66, 63, 0.08);
      color: var(--tofex-charcoal);
    }

    /* Order Address / Notes Details */
    .order-details {
      display: grid;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #FCF9F6;
      border: 1px solid rgba(74, 66, 63, 0.08);
      font-size: 12.5px;
    }

    .note-box {
      padding: 7px 10px;
      border-radius: 8px;
      background: rgba(220, 133, 41, 0.10);
      border-left: 3px solid var(--tofex-amber);
      color: var(--tofex-charcoal);
      font-size: 12px;
      font-weight: 500;
    }

    /* Action Buttons (Thumb-friendly Figma "Book/Check" Pills) */
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease, box-shadow 0.15s ease;
    }

    button:active, .button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .primary {
      background: linear-gradient(135deg, var(--tofex-crimson), var(--tofex-terracotta));
      color: var(--tofex-white);
      box-shadow: 0 4px 12px rgba(139, 17, 19, 0.22);
    }

    .blaze {
      background: linear-gradient(135deg, var(--tofex-blaze-orange), var(--tofex-amber));
      color: var(--tofex-white);
      box-shadow: 0 4px 12px rgba(232, 99, 10, 0.24);
    }

    .secondary {
      background: var(--tofex-white);
      color: var(--tofex-charcoal);
      border: 1px solid rgba(74, 66, 63, 0.16);
    }

    .secondary:hover { background: #FAF6F2; }

    .danger {
      background: rgba(139, 17, 19, 0.08);
      color: var(--tofex-crimson);
      border: 1px solid rgba(139, 17, 19, 0.20);
    }

    .btn-sm {
      min-height: 34px;
      padding: 6px 11px;
      font-size: 12px;
      border-radius: 8px;
    }

    /* Menu Category & Rows */
    .menu-category {
      margin-top: 18px;
    }
    .menu-category:first-child { margin-top: 0; }
    .menu-category h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--tofex-crimson);
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      border-radius: 10px;
      transition: background-color 0.15s ease;
    }
    .menu-row:hover { background: #FAF6F2; }
    .menu-row:last-child { border-bottom: 0; }

    .menu-info { flex: 1; min-width: 0; }
    .menu-info strong { font-size: 14px; font-weight: 700; display: block; }
    .menu-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted-ink);
    }

    .menu-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .price {
      font-weight: 800;
      font-size: 14px;
      color: var(--tofex-charcoal);
      white-space: nowrap;
    }

    .snapshot-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding: 10px 10px 2px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      color: var(--muted-ink);
    }

    /* Forms & Inputs */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--tofex-espresso);
    }

    input, select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid rgba(74, 66, 63, 0.18);
      border-radius: 11px;
      background: var(--tofex-white);
      color: var(--tofex-charcoal);
      font-family: inherit;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--tofex-crimson);
      box-shadow: 0 0 0 3px rgba(139, 17, 19, 0.14);
    }

    select {
      flex: 1 1 150px;
      min-width: 140px;
    }

    /* Notices & Empty State */
    .notice {
      position: sticky;
      top: 14px;
      z-index: 40;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(29, 122, 71, 0.22);
      box-shadow: 0 8px 24px rgba(24, 21, 20, 0.10);
    }

    .notice.error {
      background: #FDECEC;
      color: var(--tofex-crimson);
      border-color: rgba(139, 17, 19, 0.24);
    }

    .empty {
      padding: 28px 18px;
      border: 1.5px dashed rgba(74, 66, 63, 0.20);
      border-radius: 16px;
      text-align: center;
      color: var(--muted-ink);
      background: rgba(255, 255, 255, 0.7);
      font-weight: 600;
    }

    /* Modals & Mobile Slide-Up Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 21, 20, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      z-index: 60;
      padding: 18px;
      animation: fade 0.15s ease;
    }

    .modal {
      width: min(500px, 100%);
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--tofex-white);
      border-radius: 22px;
      padding: 22px 24px;
      box-shadow: 0 28px 70px rgba(24, 21, 20, 0.35);
      animation: pop 0.18s ease;
    }

    .sheet-handle {
      display: none;
      width: 44px;
      height: 4px;
      border-radius: 99px;
      background: rgba(74, 66, 63, 0.22);
      margin: 0 auto 14px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: var(--tofex-charcoal);
    }

    .icon-btn {
      width: 36px;
      min-height: 36px;
      padding: 0;
      border-radius: 10px;
      background: rgba(74, 66, 63, 0.08);
      color: var(--tofex-charcoal);
      font-size: 20px;
    }

    .modal-actions {
      margin-top: 16px;
      grid-column: 1 / -1;
      justify-content: flex-end;
    }

    .checkbox-label {
      display: flex !important;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      color: var(--tofex-charcoal);
      font-size: 14px;
      padding: 8px 0;
    }

    .checkbox-label input {
      width: 20px;
      height: 20px;
      min-height: 20px;
      accent-color: var(--tofex-crimson);
    }

    /* Account Sheet Cards (Figma Account Screen Style) */
    .account-stack {
      display: grid;
      gap: 12px;
    }
    .account-card {
      background: #FAF6F2;
      border: 1px solid rgba(74, 66, 63, 0.10);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .account-list {
      background: #FAF6F2;
      border: 1px solid rgba(74, 66, 63, 0.10);
      border-radius: 14px;
      overflow: hidden;
    }
    .account-row {
      width: 100%;
      min-height: 48px;
      border-radius: 0;
      border-bottom: 1px solid rgba(74, 66, 63, 0.08);
      background: transparent;
      color: var(--tofex-charcoal);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      font-weight: 600;
    }
    .account-row:last-child { border-bottom: 0; }

    /* Mobile Fixed Bottom Navigation Bar (Figma Frame 7) */
    .bottom-nav {
      display: none;
    }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

    /* Responsive Mobile Layout */
    @media (max-width: 900px) {
      .shell {
        display: block;
      }

      aside.sidebar {
        display: none;
      }

      /* Mobile Sticky Frosted App Bar */
      .mobile-header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        background: var(--tofex-frost-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--tofex-frost-border);
      }

      .mob-icon-btn {
        position: relative;
        width: 40px;
        min-height: 40px;
        padding: 0;
        border-radius: 12px;
        background: var(--tofex-white);
        border: 1px solid rgba(74, 66, 63, 0.10);
        color: var(--tofex-charcoal);
        box-shadow: var(--card-shadow);
      }

      .mob-dot {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 99px;
        background: var(--tofex-crimson);
        color: var(--tofex-white);
        font-size: 10px;
        font-weight: 800;
        display: grid;
        place-items: center;
        border: 2px solid var(--tofex-white);
      }

      .mob-location-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 99px;
        background: var(--tofex-white);
        border: 1px solid rgba(74, 66, 63, 0.10);
        font-size: 12.5px;
        font-weight: 700;
        color: var(--tofex-charcoal);
        box-shadow: var(--card-shadow);
        max-width: 58vw;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--tofex-blaze-orange);
        flex-shrink: 0;
      }

      main {
        padding: 14px 16px calc(94px + env(safe-area-inset-bottom));
      }

      /* Curved Sub-page Header Banner (Figma Booking History style) */
      .sub-banner {
        margin: -14px -16px 16px;
        padding: 18px 18px 20px;
        background: linear-gradient(135deg, var(--tofex-crimson), var(--tofex-burgundy));
        color: var(--tofex-white);
        border-radius: 0 0 22px 22px;
        box-shadow: 0 8px 22px rgba(104, 16, 21, 0.24);
      }
      .sub-banner .eyebrow-light { color: var(--tofex-amber); }
      .sub-banner h1 { color: var(--tofex-white); font-size: 23px; margin: 2px 0; }
      .sub-banner .muted { color: rgba(255, 255, 255, 0.85); opacity: 1; font-size: 12.5px; }
      .sub-banner .secondary {
        background: rgba(255, 255, 255, 0.16);
        color: var(--tofex-white);
        border-color: rgba(255, 255, 255, 0.28);
      }

      /* Swipeable Hero Carousel on Mobile */
      .hero-carousel {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 12px;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      .hero-carousel::-webkit-scrollbar { display: none; }
      .hero-card {
        flex: 0 0 88%;
        scroll-snap-align: center;
      }
      .carousel-dots { display: flex; }

      /* Horizontal Scrollable Metric Strip on Mobile (Figma Today New Arivable) */
      .stats-strip {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 10px;
        scrollbar-width: none;
        padding-bottom: 4px;
      }
      .stats-strip::-webkit-scrollbar { display: none; }
      .stat-card {
        flex: 0 0 138px;
        scroll-snap-align: start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      /* Mobile Fixed Bottom Navigation Bar */
      .bottom-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: center;
        padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(74, 66, 63, 0.08);
        border-radius: 22px 22px 0 0;
        box-shadow: 0 -5px 18px rgba(24, 21, 20, 0.10);
      }

      .bottom-nav a {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        min-height: 48px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        color: var(--tofex-espresso);
      }

      .bottom-nav a.active {
        color: var(--tofex-crimson);
        font-weight: 700;
      }

      .bottom-nav a.active .bnav-ic {
        background: rgba(139, 17, 19, 0.11);
        color: var(--tofex-crimson);
      }

      .bnav-ic {
        position: relative;
        width: 38px;
        height: 28px;
        border-radius: 10px;
        display: grid;
        place-items: center;
      }

      .bnav-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 99px;
        background: var(--tofex-crimson);
        color: var(--tofex-white);
        font-size: 10px;
        font-weight: 800;
        display: grid;
        place-items: center;
      }
    }

    @media (max-width: 640px) {
      .modal-overlay {
        padding: 0;
        align-items: end;
      }
      .modal {
        width: 100%;
        max-height: 88dvh;
        border-radius: 24px 24px 0 0;
        padding: 14px 18px calc(24px + env(safe-area-inset-bottom));
      }
      .sheet-handle { display: block; }
      .menu-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .menu-right {
        width: 100%;
        justify-content: space-between;
      }
      .actions > button, .actions > a.button {
        flex: 1 1 auto;
      }
    }

    /* ══════════════════════════════════════════════════════════════════
       GLASS + MOTION SYSTEM
       Timing: every UI animation < 300ms. Easing: slow-in/slow-out, springs for follow-through.
       Frequent actions (tabs, chips, polling) stay near-silent; rare moments get exaggerated.
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-inout: cubic-bezier(.65, 0, .35, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --t-fast: 110ms;
      --t-base: 200ms;
      --t-pop: 280ms;

      --glass-fill: linear-gradient(150deg, rgba(255,255,255,.80) 0%, rgba(255,250,245,.58) 55%, rgba(255,243,232,.48) 100%);
      --glass-fill-dense: linear-gradient(150deg, rgba(255,255,255,.93), rgba(255,250,245,.80));
      --glass-edge: linear-gradient(145deg, rgba(255,255,255,.98), rgba(255,255,255,.30) 36%, rgba(255,255,255,.08) 62%, rgba(255,255,255,.78));
      --glass-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(139,17,19,.07),
        0 1px 2px rgba(24,21,20,.05),
        0 12px 28px -8px rgba(104,16,21,.18);
      --glass-shadow-lift:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(139,17,19,.07),
        0 2px 4px rgba(24,21,20,.06),
        0 20px 38px -10px rgba(104,16,21,.28);
    }

    [hidden] { display: none !important; }
    body.modal-open { overflow: hidden; }

    /* Ambient colour field: gives the glass something to refract. Static on purpose (no idle motion). */
    .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .ambient i { position: absolute; border-radius: 50%; }
    .ambient i:nth-child(1) { width: 460px; height: 460px; left: -120px; top: -100px; background: radial-gradient(circle, rgba(139,17,19,.34), transparent 68%); }
    .ambient i:nth-child(2) { width: 420px; height: 420px; right: -110px; top: 24%; background: radial-gradient(circle, rgba(220,133,41,.40), transparent 68%); }
    .ambient i:nth-child(3) { width: 400px; height: 400px; left: 26%; bottom: -150px; background: radial-gradient(circle, rgba(232,99,10,.28), transparent 68%); }
    .shell { position: relative; z-index: 1; }

    /* ── Glass surfaces (layered: translucent fill + blur/saturate + specular edge + inner highlight) ── */
    .card, .panel, .stat-card, .frost-panel, .search-bar, .account-card, .account-list {
      position: relative;
      background: var(--glass-fill);
      -webkit-backdrop-filter: blur(14px) saturate(165%);
      backdrop-filter: blur(14px) saturate(165%);
      border: 1px solid rgba(255,255,255,.38);
      box-shadow: var(--glass-shadow);
    }
    .card::after, .panel::after, .stat-card::after, .frost-panel::after, .search-bar::after,
    .account-card::after, .account-list::after, .mobile-header::after, .bottom-nav::after, .notice::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
      background: var(--glass-edge);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .frost-panel { background: var(--glass-fill); }

    /* Chrome (always on screen) gets heavier glass so content scrolling beneath stays legible */
    .mobile-header {
      background: linear-gradient(180deg, rgba(255,251,247,.86), rgba(245,236,228,.66));
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,.55);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 26px -12px rgba(104,16,21,.25);
    }
    .bottom-nav {
      background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(250,243,236,.74));
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      border-top: 1px solid rgba(255,255,255,.6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 -10px 28px -10px rgba(104,16,21,.22);
    }
    .modal {
      position: relative;
      background: var(--glass-fill-dense);
      -webkit-backdrop-filter: blur(30px) saturate(185%);
      backdrop-filter: blur(30px) saturate(185%);
      border: 1px solid rgba(255,255,255,.75);
      box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(139,17,19,.06), 0 44px 90px -24px rgba(24,21,20,.55), 0 12px 30px rgba(104,16,21,.2);
    }
    .modal-overlay {
      background: radial-gradient(circle at 50% 28%, rgba(104,16,21,.38), rgba(24,21,20,.72));
      -webkit-backdrop-filter: blur(10px) saturate(125%);
      backdrop-filter: blur(10px) saturate(125%);
    }
    .sidebar { box-shadow: inset -1px 0 0 rgba(255,255,255,.08), 8px 0 30px -12px rgba(24,21,20,.45); }

    .chip {
      background: rgba(255,255,255,.72);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(24,21,20,.06);
    }
    .chip.active {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.2), 0 8px 16px -4px rgba(139,17,19,.45);
    }

    /* ── Solid 3D: raised tiles, glossy hero, pressed-in buttons ── */
    .brand-badge, .card-thumb, .stat-icon {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(24,21,20,.08), 0 3px 8px rgba(24,21,20,.1);
    }
    .brand-badge { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(0,0,0,.22), 0 10px 22px rgba(139,17,19,.5); }
    .hero-card.primary-grad {
      background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 44%),
                  linear-gradient(124deg, var(--tofex-crimson) 6%, var(--tofex-terracotta) 62%, var(--tofex-amber) 108%);
    }
    .hero-card.secondary-grad {
      background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 44%),
                  linear-gradient(124deg, var(--tofex-burgundy) 8%, var(--tofex-blaze-orange) 74%, var(--tofex-amber) 110%);
    }
    .hero-card {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -14px 28px rgba(0,0,0,.14), 0 18px 34px -10px rgba(104,16,21,.5);
    }
    .side-nav a.active {
      box-shadow: inset 3px 0 0 var(--tofex-challenge-gold), inset 0 1px 0 rgba(255,255,255,.3), 0 8px 18px rgba(139,17,19,.4);
    }
    .primary, .blaze {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.2), 0 8px 16px -4px rgba(139,17,19,.45);
      text-shadow: 0 1px 0 rgba(0,0,0,.2);
    }
    .blaze { box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 0 rgba(0,0,0,.2), 0 8px 16px -4px rgba(232,99,10,.5); }
    .secondary, .danger { box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(24,21,20,.08); }

    /* ── Squash & stretch + anticipation + follow-through on every press ──
       Press = fast wind-up (squash wide/short, sinks 1px). Release = spring overshoot (stretch) then settle. */
    button, .button {
      transition: transform var(--t-pop) var(--ease-spring), box-shadow var(--t-base) var(--ease-out),
                  filter var(--t-base) var(--ease-out), background-color var(--t-base) var(--ease-out), opacity var(--t-base);
    }
    @media (hover: hover) {
      button:hover:not(:disabled):not(.chip), .button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    }
    button:active:not(:disabled), .button:active {
      transform: translateY(1px) scale(1.03, .93);
      transition-duration: 60ms;
      box-shadow: inset 0 2px 5px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.16);
      filter: brightness(.97);
    }
    /* Frequent controls: quieter feedback (frequency-of-use law) */
    button.chip:active:not(:disabled), .search-clear:active, .mob-icon-btn:active { transform: scale(.96); transition-duration: 50ms; }
    .chip, .bottom-nav a, .side-nav a { transition-duration: var(--t-fast); }

    .stat-card, .card { transition: transform var(--t-pop) var(--ease-spring), box-shadow var(--t-base) var(--ease-out); }
    @media (hover: hover) {
      .stat-card:hover { transform: translateY(-3px); box-shadow: var(--glass-shadow-lift); }
      .card:hover { transform: translateY(-2px); box-shadow: var(--glass-shadow-lift); }
    }
    .stat-card:active, .hero-card:active { transform: scale(.975); transition-duration: 60ms; }
    .hero-card { transition: transform var(--t-pop) var(--ease-spring); }

    .bnav-ic { transition: transform var(--t-pop) var(--ease-spring), background-color var(--t-base); }
    .bottom-nav a:active .bnav-ic { transform: scale(.86, .78); transition-duration: 50ms; }
    .bottom-nav a.active .bnav-ic { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 5px 12px -2px rgba(139,17,19,.32); }
    .dot { transition: width var(--t-base) var(--ease-spring), background-color var(--t-base); }

    /* ── Doherty: instant feedback. Button spinner + top progress bar appear in the same frame as the press ── */
    button.busy { pointer-events: none; color: transparent !important; text-shadow: none; position: relative; }
    button.busy::before {
      content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .6s linear infinite;
    }
    button.secondary.busy::before, button.danger.busy::before, button.ghost-danger.busy::before { border-color: rgba(139,17,19,.22); border-top-color: var(--tofex-crimson); }
    #netbar {
      position: fixed; left: 0; right: 0; top: 0; height: 3px; z-index: 100; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, transparent, var(--tofex-amber), var(--tofex-challenge-gold), var(--tofex-blaze-orange), transparent) no-repeat;
      background-size: 45% 100%; transition: opacity var(--t-fast);
    }
    #netbar.on { opacity: 1; animation: netslide 900ms var(--ease-inout) infinite; }

    /* ── Fitts + bigger hit areas: visual size stays small, tap target grows ── */
    .btn-sm, .icon-btn, .search-clear { position: relative; }
    .btn-sm::after { content: ""; position: absolute; inset: -5px; }
    .icon-btn::after { content: ""; position: absolute; inset: -4px; }
    .search-clear::after { content: ""; position: absolute; inset: -9px; }
    .actions > .primary, .actions > .blaze { flex: 1.5 1 auto; min-width: 104px; }   /* primary action is the biggest target */
    .actions > .danger:not(.btn-sm) { flex: 1 1 auto; }
    @media (pointer: coarse) {
      button, .button { min-height: 44px; }
      .btn-sm { min-height: 40px; }
      .chip { min-height: 42px; padding: 9px 16px; }
      .bottom-nav a { min-height: 54px; }
    }

    /* Hick's law: destructive/rare action is visually quiet, pushed away from the primary choices */
    .ghost-danger { background: transparent; color: var(--tofex-crimson); border: 0; box-shadow: none; margin-left: auto; opacity: .72; }
    .ghost-danger:hover { opacity: 1; background: rgba(139,17,19,.08); }

    /* Miller's law: orders chunked into labelled groups instead of one long list */
    .group + .group { margin-top: 22px; }
    .group .section-head h2 { display: flex; align-items: center; gap: 8px; }
    .group .chip-count { background: rgba(139,17,19,.1); color: var(--tofex-crimson); }

    /* ── Staging the focus: ONE urgent card is spotlit (glow pulses twice, then rests) ── */
    .card.urgent { border-color: rgba(139,17,19,.3); box-shadow: var(--glass-shadow), 0 0 0 1.5px rgba(139,17,19,.32), 0 16px 34px -10px rgba(139,17,19,.4); }
    .card.spot { animation: rise var(--t-pop) var(--ease-out) backwards, glowPulse 720ms var(--ease-inout) 280ms 2; }

    /* ── Notifications: arc entrance, exaggerated error wobble ── */
    .notice { display: flex; align-items: center; gap: 10px; animation: toastArc var(--t-pop) var(--ease-out) backwards;
      background: linear-gradient(135deg, rgba(230,245,236,.9), rgba(255,255,255,.7));
      -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 14px 30px -8px rgba(24,21,20,.28); }
    .notice::before { content: "✓"; width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; font-weight: 800; color: #fff; background: var(--green); box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
    .notice.error { background: linear-gradient(135deg, rgba(253,236,236,.92), rgba(255,255,255,.7));
      animation: toastArc var(--t-pop) var(--ease-out) backwards, shake 280ms var(--ease-out) 60ms; }
    .notice.error::before { content: "!"; background: var(--tofex-crimson); }

    /* ── Secondary action: badge squash-pop when a count changes, bell swings on a fresh alert ── */
    .pop { animation: badgePop var(--t-pop) var(--ease-spring); }
    .ring { animation: ring var(--t-pop) var(--ease-out); transform-origin: 50% 8%; }

    /* ── Entrance (first paint only; polling and filtering never replay it) ── */
    .enter :is(.grid, .stats-strip, .hero-carousel) > * { animation: rise var(--t-pop) var(--ease-out) backwards; }
    .enter :is(.grid, .stats-strip, .hero-carousel) > *:nth-child(2) { animation-delay: 30ms; }
    .enter :is(.grid, .stats-strip, .hero-carousel) > *:nth-child(3) { animation-delay: 60ms; }
    .enter :is(.grid, .stats-strip, .hero-carousel) > *:nth-child(4) { animation-delay: 90ms; }
    .enter :is(.grid, .stats-strip, .hero-carousel) > *:nth-child(5) { animation-delay: 120ms; }
    .enter :is(.grid, .stats-strip, .hero-carousel) > *:nth-child(n+6) { animation-delay: 150ms; }
    .enter .panel, .enter .chips-row, .enter .section-head, .enter .frost-panel { animation: fadeIn var(--t-base) var(--ease-out) backwards; }
    .card.spot { animation: rise var(--t-pop) var(--ease-out) backwards, glowPulse 720ms var(--ease-inout) 280ms 2; }

    /* ── Modals & sheets: pose-to-pose with overshoot (follow-through), quick exit ── */
    .modal-overlay { animation: fadeIn var(--t-base) var(--ease-out) backwards; }
    .modal { animation: modalPose var(--t-pop) var(--ease-out) backwards; transform-origin: 50% 60%; }
    .modal-overlay.closing { animation: fadeOut var(--t-fast) var(--ease-inout) forwards; }
    .modal-overlay.closing .modal { animation: modalOut var(--t-fast) var(--ease-inout) forwards; }
    @media (max-width: 640px) {
      .modal { animation-name: sheetPose; transform-origin: 50% 100%; }
      .modal-overlay.closing .modal { animation-name: sheetOut; }
    }
    @media (max-width: 900px) { .notice { top: 68px; } }
    @media (max-width: 640px) {
      .card, .panel, .stat-card { -webkit-backdrop-filter: blur(10px) saturate(155%); backdrop-filter: blur(10px) saturate(155%); }
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes netslide { from { background-position: -45% 0; } to { background-position: 145% 0; } }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(14px) scale(.97); }
      60% { opacity: 1; transform: translateY(-3px) scale(1.008); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes modalPose {
      0% { opacity: 0; transform: translateY(22px) scale(.95); }
      55% { opacity: 1; transform: translateY(-5px) scale(1.012); }
      80% { transform: translateY(1px) scale(.998); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes modalOut { to { opacity: 0; transform: translateY(10px) scale(.97); } }
    @keyframes sheetPose {
      0% { transform: translateY(100%); }
      62% { transform: translateY(-10px); }
      82% { transform: translateY(3px); }
      100% { transform: none; }
    }
    @keyframes sheetOut { to { transform: translateY(100%); } }
    @keyframes toastArc {
      0% { opacity: 0; transform: translate(-22px, -18px) rotate(-2.5deg) scale(.96); }
      50% { opacity: 1; transform: translate(-5px, 4px) rotate(.8deg) scale(1.02); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes shake {
      0%, 100% { translate: 0; } 20% { translate: -7px; } 40% { translate: 6px; } 60% { translate: -4px; } 80% { translate: 2px; }
    }
    @keyframes badgePop {
      0% { transform: scale(.4); } 45% { transform: scale(1.4, .85); } 70% { transform: scale(.92, 1.1); } 100% { transform: scale(1); }
    }
    @keyframes ring {
      0% { transform: rotate(0); } 20% { transform: rotate(16deg); } 45% { transform: rotate(-12deg); } 70% { transform: rotate(6deg); } 100% { transform: rotate(0); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: var(--glass-shadow), 0 0 0 1.5px rgba(139,17,19,.32), 0 16px 34px -10px rgba(139,17,19,.4); }
      50% { box-shadow: var(--glass-shadow), 0 0 0 6px rgba(232,99,10,.3), 0 20px 40px -8px rgba(232,99,10,.5); }
    }

    /* No backdrop-filter support: fall back to near-opaque surfaces so text never loses contrast */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card, .panel, .stat-card, .frost-panel, .search-bar, .account-card, .account-list { background: rgba(255,255,255,.96); }
      .modal { background: #fff; }
      .mobile-header, .bottom-nav { background: rgba(250,246,242,.98); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2v4M15 2v4M9 11h6M9 15h4"/></svg>
          Orders
          <span class="nav-badge" id="sideAlertBadge" hidden>0</span>
        </a>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M4 15h16M7 11a5 5 0 0 1 10 0v0H7zM12 4v2"/></svg>

    <!-- Main Workspace -->
    <main>

          <input id="searchInput" type="search" placeholder="Search orders, menu items, riders, or areas..." oninput="onSearchInput(this.value)">

    <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>

        </span>

<script>
let data = { items: [], orders: [], riders: [], areas: [], archivedRiders: [] };
let searchQuery = '';
let orderFilter = 'all';
let menuCatFilter = 'all';

const page =
  location.pathname === '/manage-menu' ? 'menu' :
  location.pathname === '/orders' ? 'orders' :
  location.pathname === '/riders' ? 'riders' :
  location.pathname === '/delivery-areas' ? 'areas' :
  'dashboard';

document.querySelectorAll(`[data-page="${page}"]`).forEach(el => el.classList.add('active'));

const searchPlaceholders = {
  dashboard: 'Search active orders, dishes, or riders...',
  orders: 'Search by order #, customer name, phone, area, or dish...',
  menu: 'Search menu items or categories...',
  riders: 'Search riders by name or phone...',
  areas: 'Search delivery areas...'
};
document.querySelector('#searchInput').placeholder = searchPlaceholders[page] || searchPlaceholders.dashboard;

const money = v => `₦${Number(v).toLocaleString('en-NG')}`;

/* Postel's law: accept messy input ("  +234 801-234 5678 ", "₦1,500"), send clean values */
const tidy = s => String(s ?? '').trim().replace(/\s+/g, ' ');
const cleanPhone = s => String(s ?? '').replace(/[^\d+]/g, '');
const cleanMoney = s => Number(String(s ?? '').replace(/[₦,\s]/g, ''));

let firstPaint = true, spotKey = null;
const popEl = el => { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
const ringBell = () => {
  const el = document.querySelector('#mobBellBtn svg');
  if (!el) return;
  el.classList.remove('ring'); void el.getBoundingClientRect(); el.classList.add('ring');
};
function afterRender() {
  const app = document.getElementById('app');
  if (firstPaint) {                       // entrance plays once per page load, never on polling/filtering
    firstPaint = false;
    app.classList.add('enter');
    setTimeout(() => app.classList.remove('enter'), 650);
  }
  const first = app.querySelector('.card.urgent');   // staging: only ONE card gets the spotlight
  if (first) {
    const k = first.dataset.oid;
    if (k !== spotKey) first.classList.add('spot');
    spotKey = k;
  } else spotKey = null;
}
function groupedOrders(list) {
  if (!list.length) return '<div class="empty">No orders match this filter.</div>';
  if (orderFilter !== 'all') return `<div class="grid">${list.map(orderCard).join('')}</div>`;
  const groups = [
    ['Needs your action', list.filter(needsStaffAction)],
    ['In progress', list.filter(o => !needsStaffAction(o) && active(o))],
    ['Completed', list.filter(o => !needsStaffAction(o) && !active(o))],
  ];
  return groups.filter(([, l]) => l.length).map(([t, l]) => `
    <section class="section group">
      <div class="section-head"><h2>${t} <span class="chip-count">${l.length}</span></h2></div>
      <div class="grid">${l.map(orderCard).join('')}</div>
    </section>`).join('');
}
function enableSheetSwipe() {            // Jakob's law: bottom sheets dismiss by swiping down, like every phone app
  const modal = document.querySelector('.modal');
  if (!modal || !window.matchMedia('(max-width: 640px)').matches) return;
  let y0 = null, dy = 0;
  [modal.querySelector('.sheet-handle'), modal.querySelector('.modal-head')].forEach(el => {
    if (!el) return;
    el.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; modal.style.transition = 'none'; }, { passive: true });
    el.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); modal.style.transform = `translateY(${dy}px)`; }, { passive: true });
    el.addEventListener('touchend', () => {
      if (y0 === null) return;
      modal.style.transition = '';
      if (dy > 90) closeModal(); else modal.style.transform = '';
      y0 = null;
    });
  });
}
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));

let inflight = 0, lastPress = null, lastPressAt = 0;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button, .button');
  if (b) { lastPress = b; lastPressAt = performance.now(); }
}, true);
const request = async (url, opt = {}) => {
  const mutating = opt.method && opt.method !== 'GET';
  const btn = mutating && lastPress && performance.now() - lastPressAt < 1500 ? lastPress : null;
  const bar = document.getElementById('netbar');
  if (mutating) { inflight++; bar.classList.add('on'); }
  if (btn) btn.classList.add('busy');                 // Doherty threshold: acknowledge in the same frame
  try { return await rawRequest(url, opt); }
  finally {
    if (mutating && --inflight === 0) bar.classList.remove('on');
    if (btn) btn.classList.remove('busy');
  }
};
const rawRequest = async (url, opt = {}) => {
  const r = await fetch(url, opt);
  if (r.status === 401) {
    location.href = '/login';
    throw Error('Please sign in again.');
  }
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw Error(typeof d.detail === 'string' ? d.detail : Array.isArray(d.detail) ? d.detail.map(x => x.msg).join(', ') : 'Request failed');
  }
  return r.status === 204 ? null : r.json();
};

const notice = (t, error = false) => {
  const n = document.querySelector('#notice');
  n.hidden = true;
  n.className = `notice${error ? ' error' : ''}`;
  void n.offsetWidth;          // restart the entrance animation
  n.hidden = false;
  n.textContent = t;
  clearTimeout(notice._t);
  notice._t = setTimeout(() => { n.hidden = true; }, 3500);
};

const active = o => !['delivered', 'collected', 'cancelled', 'failed'].includes(o.fulfillment?.stage) && o.status !== 'cancelled';
const needsStaffAction = o => {
  const f = o.fulfillment || {};
  return (
    (f.stage === 'awaiting_approval' && o.status === 'pending') ||
    f.stage === 'awaiting_fee_quote' ||
    (f.stage === 'ready') ||
    attention(o)
  );
};
const attention = o => {
  const f = o.fulfillment || {};
  return (f.stage === 'failed' && !f.failed_acknowledged) ||
    (f.not_received_at && !f.not_received_acknowledged) ||
    !!f.dispatch_error ||
    (f.stage === 'awaiting_approval' && o.status === 'pending') ||
    f.stage === 'awaiting_fee_quote';
};
const greeting = () => {
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
};

function onSearchInput(val) {
  searchQuery = (val || '').trim().toLowerCase();
  document.querySelector('#searchClear').hidden = !searchQuery;
  render();
}
function clearSearch() {
  searchQuery = '';
  const inp = document.querySelector('#searchInput');
  inp.value = '';
  document.querySelector('#searchClear').hidden = true;
  render();
  inp.focus();
}

function setOrderFilter(f) { orderFilter = f; render(); }
function setMenuCatFilter(c) { menuCatFilter = c; render(); }

async function load() {
  try {
    const [items, orders, riders, areas, archivedRiders] = await Promise.all([
      request('/api/staff/menu'),
      request('/api/staff/orders'),
      request('/api/staff/riders'),
      request('/api/staff/delivery-areas'),
      request('/api/staff/riders/archived')
    ]);
    data = { items, orders, riders, areas, archivedRiders };
    render();
    updateSoundBtn();
    checkAlerts();
  } catch (e) {
    notice(e.message, true);
  }
}

function renderHeader(title, subtitle, rightHtml = '') {
  const isSub = page !== 'dashboard';
  document.querySelector('#headerSlot').innerHTML = `
    <header class="page-header ${isSub ? 'sub-banner' : ''}">
      <div>
        <div class="eyebrow-light">Tofex Operations</div>
        <h1>${title}</h1>
        <p class="muted" style="margin:0">${subtitle}</p>
      </div>
      <div class="header-actions">${rightHtml}</div>
    </header>`;
}

const fmt = t => t ? new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
const mins = (a, b) => Math.max(0, Math.round((b - a) / 60000));
const elapsed = o => {
  const f = o.fulfillment || {};
  if (!f.approved_at) return null;
  const end = f.delivered_at || f.collected_at || f.failed_at;
  return mins(new Date(f.approved_at), end ? new Date(end) : new Date());
};
const overdue = o => {
  const f = o.fulfillment || {}, m = elapsed(o);
  return f.type === 'delivery' && f.expected_minutes && m !== null && ['preparing', 'ready', 'dispatched', 'out_for_delivery'].includes(f.stage) && m > f.expected_minutes + 10;
};

function copyText(b) {
  navigator.clipboard.writeText(b.dataset.text).then(
    () => notice('Address copied.'),
    () => notice('Could not copy. Select the text and copy it by hand.', true)
  );
}

function stageMeta(o) {
  const f = o.fulfillment || {}, s = f.stage || o.status;
  if (s === 'failed' || o.status === 'cancelled' || f.dispatch_error) return { badge: 'crimson', thumb: 'crimson', label: s.replaceAll('_', ' ') };
  if (s === 'awaiting_approval' || s === 'awaiting_fee_quote') return { badge: 'crimson', thumb: 'crimson', label: s.replaceAll('_', ' ') };
  if (s === 'dispatched' || s === 'out_for_delivery') return { badge: 'orange', thumb: 'orange', label: s.replaceAll('_', ' ') };
  if (s === 'delivered' || s === 'collected' || s === 'ready') return { badge: 'green', thumb: 'green', label: s.replaceAll('_', ' ') };
  return { badge: '', thumb: '', label: s.replaceAll('_', ' ') };
}

function detailBlock(o) {
  const f = o.fulfillment;
  if (!f) return '';
  const out = [];
  if (f.type === 'pickup') {
    out.push('<div class="muted"><strong>Pickup order</strong> · Collect at the outlet</div>');
  } else if (f.street) {
    const addr = `${f.street}, ${f.area_name || ''}`;
    out.push(`<div><strong>📍 ${esc(addr)}</strong></div>`);
    if (f.landmark) out.push(`<div class="muted">Landmark: ${esc(f.landmark)}</div>`);
    if (f.phone2) out.push(`<div class="muted">Backup phone: <a href="tel:${esc(f.phone2)}" style="text-decoration:underline">${esc(f.phone2)}</a></div>`);
    if (f.notes) out.push(`<div class="note-box">${esc(f.notes)}</div>`);
    out.push(`<div class="actions" style="margin-top:4px"><button type="button" class="secondary btn-sm" data-text="${esc(addr)}" onclick="copyText(this)">Copy address</button>${f.map_link ? `<a class="button secondary btn-sm" href="${esc(f.map_link)}" target="_blank" rel="noopener">Open map</a>` : ''}</div>`);
  } else if (f.area_name) {
    out.push(`<div class="muted">Area: <strong>${esc(f.area_name)}</strong></div>`);
  }
  if (f.rider_name) {
    out.push(`<div class="muted">🛵 Rider: <strong>${esc(f.rider_name)}</strong>${f.rider_phone ? ` · <a href="tel:${esc(f.rider_phone)}" style="text-decoration:underline">${esc(f.rider_phone)}</a>` : ''}</div>`);
  }
  const m = elapsed(o);
  if (m !== null) {
    out.push(`<div class="muted">⏱ ${m} min since approval${overdue(o) ? ' <span class="badge crimson">Overdue</span>' : ''}</div>`);
  }
  const tl = [['Approved', f.approved_at], ['Dispatched', f.dispatched_at], ['Picked up', f.picked_up_at], ['Delivered', f.delivered_at], ['Collected', f.collected_at], ['Failed', f.failed_at]]
    .filter(x => x[1]).map(x => `${x[0]} ${fmt(x[1])}`);
  if (tl.length) out.push(`<div class="muted" style="font-size:11.5px">${tl.join(' → ')}</div>`);
  if (f.address_editing) out.push('<div class="badge crimson">Customer is changing the delivery address</div>');
  if (f.dispatch_error) out.push(`<div class="badge crimson">Dispatch failed: ${esc(f.dispatch_error)}. Check rider &amp; retry.</div>`);
  if (f.stage === 'failed') {
    out.push(`<div class="badge crimson">Delivery failed: ${esc(f.failure_reasons || '')}</div>${f.failed_acknowledged ? '' : `<div class="actions"><button type="button" class="secondary btn-sm" onclick="ackFailed(${o.id})">Acknowledge</button></div>`}`);
  }
  if (f.not_received_at && !f.not_received_acknowledged) {
    out.push(`<div class="badge crimson">Customer reported order not received</div><div class="actions"><button type="button" class="secondary btn-sm" onclick="ackNotReceived(${o.id})">Acknowledge</button></div>`);
  }
  return out.length ? `<div class="order-details">${out.join('')}</div>` : '';
}

function actions(o) {
  const f = o.fulfillment || {};
  const opts = data.riders.filter(r => r.available).map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
  if (!f.stage && o.status === 'pending') {
    return `<div class="actions"><button class="danger" onclick="review(${o.id},'reject')">Reject</button><button class="primary" onclick="review(${o.id},'approve')">Approve</button></div>`;
  }
  if (f.stage === 'awaiting_fee_quote') {
    return `<div class="actions"><span class="muted">Custom area: "${esc(f.area_name || '')}"</span><button class="blaze" onclick="quoteModal(${o.id})">Send quote</button></div>`;
  }
  if (f.stage === 'awaiting_fee_accept') {
    return `<div class="actions"><span class="muted">Quote sent · awaiting reply</span><button class="secondary" onclick="quoteModal(${o.id})">Edit quote</button></div>`;
  }
  if (f.stage === 'collecting_details') return `<span class="muted" style="font-size:12px">Customer is still completing checkout.</span>`;
  if (f.stage === 'awaiting_payment') return `<span class="muted" style="font-size:12px">Awaiting payment receipt photo.</span>`;
  if (f.stage === 'awaiting_approval' && o.status === 'pending') {
    return `<div class="actions"><button class="danger" onclick="review(${o.id},'reject')">Reject</button><button class="primary" ${f.address_editing ? 'disabled title="Customer is changing the address"' : ''} onclick="review(${o.id},'approve')">Approve</button></div>`;
  }
  if (f.stage === 'preparing') {
    return `<button class="blaze" onclick="postAction(${o.id},'ready')">Mark ready</button>`;
  }
  if (f.stage === 'ready' && f.type === 'delivery') {
    return `<div class="actions"><select id="r${o.id}"><option value="">${opts ? 'Choose rider…' : 'No rider available'}</option>${opts}</select><button class="primary" onclick="dispatch(${o.id})">Dispatch</button><button class="danger btn-sm" onclick="failModal(${o.id})">Mark failed</button></div>`;
  }
  if (f.stage === 'dispatched') {
    return `<div class="actions"><select id="r${o.id}"><option value="">Reassign to…</option>${opts}</select><button class="secondary" onclick="reassign(${o.id})">Reassign</button><button class="danger btn-sm" onclick="failModal(${o.id})">Mark failed</button></div>`;
  }
  if (f.stage === 'out_for_delivery') {
    return `<div class="actions"><span class="badge orange">With the rider</span><button class="danger btn-sm" onclick="failModal(${o.id})">Mark failed</button></div>`;
  }
  if (f.stage === 'ready' && f.type === 'pickup') {
    return `<button class="primary" onclick="postAction(${o.id},'collected')">Mark collected</button>`;
  }
  return '';
}

function isLowStock(i) {
  return i.stock_quantity !== null && i.stock_quantity <= (i.low_stock_threshold || 0);

function menuRowHtml(i, full) {
  const lowStock = isLowStock(i);
  const sub = full ? `<span>${esc(i.description || 'No description')}</span>` : `<span class="badge muted-pill">${esc(i.category)}</span>`;
  return `
    <div class="menu-row">
      <div class="menu-info">
        <strong>${esc(i.name)}</strong>
        <div class="menu-meta">
          ${sub}
          <span class="badge ${i.is_available ? 'green' : 'crimson'}">${i.is_available ? 'Available' : 'Hidden'}</span>
          <span class="badge ${lowStock ? 'crimson' : 'muted-pill'}">Stock: ${i.stock_quantity ?? 'untracked'}</span>
        </div>
      </div>
      <div class="menu-right">

      </div>
    </div>`;
}

function pickMenuSnapshot(items, limit = 5) {
  // Miller's law: surface up to 5 high-signal items on Overview instead of every category
  const picked = [];
  const seen = new Set();
  const push = item => { if (!seen.has(item.id) && picked.length < limit) { seen.add(item.id); picked.push(item); } };

  items.filter(i => !i.is_available).forEach(push);
  items.filter(i => i.is_available && isLowStock(i)).forEach(push);

  const byCategory = Object.values(items.reduce((acc, i) => ((acc[i.category] ??= []).push(i), acc), {}));
  for (let round = 0; picked.length < limit && byCategory.some(list => round < list.length); round++) {
    byCategory.forEach(list => { if (round < list.length) push(list[round]); });
  }
  return picked;
}

function menuPreview(full = false) {
  let itemsList = data.items;
  if (searchQuery) {
    itemsList = itemsList.filter(i =>
      i.name.toLowerCase().includes(searchQuery) ||
      i.category.toLowerCase().includes(searchQuery) ||
      (i.description || '').toLowerCase().includes(searchQuery)
    );
  }
  if (!itemsList.length) return '<div class="empty">No matching menu items found.</div>';

  if (!full) {
    const snapshot = pickMenuSnapshot(itemsList, 5);
    const catCount = new Set(itemsList.map(i => i.category)).size;
    const hiddenCount = itemsList.filter(i => !i.is_available).length;
    const lowCount = itemsList.filter(i => i.is_available && isLowStock(i)).length;
    const summary = [
      `Showing ${snapshot.length} of ${itemsList.length} item${itemsList.length === 1 ? '' : 's'}`,
      `${catCount} categor${catCount === 1 ? 'y' : 'ies'}`,
      hiddenCount ? `${hiddenCount} hidden` : '',
      lowCount ? `${lowCount} low stock` : '',
    ].filter(Boolean).join(' · ');

    return `
      ${snapshot.map(i => menuRowHtml(i, false)).join('')}
      <div class="snapshot-foot">
        <span>${summary}</span>
        ${itemsList.length > snapshot.length ? `<a class="see-all" href="/manage-menu">View all ${itemsList.length} ›</a>` : ''}
      </div>`;
  }

  if (menuCatFilter !== 'all') {
    itemsList = itemsList.filter(i => i.category === menuCatFilter);
  }
  const groups = {};
  itemsList.forEach(i => (groups[i.category] ??= []).push(i));

  return Object.entries(groups).map(([cat, items]) => `
    <div class="menu-category">
      <h3>${esc(cat)}</h3>
      ${items.map(i => menuRowHtml(i, true)).join('')}
    </div>`).join('') || '<div class="empty">No matching menu items found.</div>';
}

function matchesOrderSearch(o) {
  if (!searchQuery) return true;
  const f = o.fulfillment || {};
  const haystack = [
    String(o.id),
    o.customer,
    o.phone_number,
    f.area_name,
    f.street,
    f.stage,
    ...o.orders.flatMap(x => x.items.map(i => i.name))
  ].filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(searchQuery);
}

function wireHeroDots() {
  const hc = document.getElementById('heroCarousel');
  const d0 = document.getElementById('heroDot0');
  const d1 = document.getElementById('heroDot1');
  if (!hc || !d0 || !d1) return;
  hc.addEventListener('scroll', () => {
    const idx = hc.scrollLeft > hc.clientWidth * 0.45 ? 1 : 0;
    d0.classList.toggle('active', idx === 0);
    d1.classList.toggle('active', idx === 1);
  }, { passive: true });
}

function openModal(title, bodyHtml) {
  document.querySelector('#modalRoot').innerHTML = `
    <div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="icon-btn" onclick="closeModal()" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
      </div>
    </div>`;
  document.body.classList.add('modal-open');
  enableSheetSwipe();
}

function closeModal() {
  const root = document.querySelector('#modalRoot'), ov = root.querySelector('.modal-overlay');
  document.body.classList.remove('modal-open');
  if (!ov) return;
  ov.classList.add('closing');
  setTimeout(() => { if (ov.isConnected) root.innerHTML = ''; }, 130);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function confirmModal(title, message, confirmLabel = 'Confirm', danger = false) {
  return new Promise(resolve => {
    openModal(title, `
      <p class="muted" style="margin-top:0">${esc(message)}</p>
      <div class="actions modal-actions">
        <button type="button" class="secondary" id="modalCancel">Cancel</button>
        <button type="button" class="${danger ? 'danger' : 'primary'}" id="modalConfirm">${esc(confirmLabel)}</button>
      </div>`);
    document.querySelector('#modalCancel').onclick = () => { closeModal(); resolve(false); };
    document.querySelector('#modalConfirm').onclick = () => { closeModal(); resolve(true); };
  });
}

function menuFormModal(item = null) {

      <label>Name<input id="mfName" required maxlength="120" value="${esc(item?.name || '')}"></label>
      <label>Category<input id="mfCategory" required maxlength="60" list="categoryList" value="${esc(item?.category || '')}"></label>
      <datalist id="categoryList">${categories.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <label>Price (₦)<input id="mfPrice" inputmode="decimal" autocomplete="off" required value="${item?.price ?? ''}"></label>
      <label>Stock qty (blank = untracked)<input id="mfStock" type="number" min="0" value="${item?.stock_quantity ?? ''}"></label>
      <label>Low stock alert<input id="mfLow" type="number" min="0" value="${item?.low_stock_threshold ?? 0}"></label>
      <label>Description<input id="mfDesc" maxlength="500" value="${esc(item?.description || '')}"></label>

      </div>
    </form>`);
  document.querySelector('#menuForm').onsubmit = async e => {
    e.preventDefault();

let soundOn = localStorage.getItem('tofexSound') === '1', audioCtx = null, knownAlerts = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880;
    g.gain.value = 0.15;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function updateSoundBtn() {
  const sb = document.querySelector('#sideSoundBtn');
  if (sb) sb.textContent = soundOn ? '🔔 Sound on' : '🔕 Enable sound';
  const mb = document.querySelector('#mobBellBtn');
  if (mb) mb.style.color = soundOn ? 'var(--tofex-crimson)' : 'var(--tofex-charcoal)';
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('tofexSound', soundOn ? '1' : '0');
  if (soundOn) beep();
  updateSoundBtn();
}

function alertKeys() {
  const keys = [];
  data.orders.forEach(o => {
    const f = o.fulfillment || {};
    if (f.stage === 'awaiting_approval' && o.status === 'pending') keys.push('approve:' + o.id);
    if (f.stage === 'awaiting_fee_quote') keys.push('quote:' + o.id);
    if (f.stage === 'failed' && !f.failed_acknowledged) keys.push('failed:' + o.id);
    if (f.not_received_at && !f.not_received_acknowledged) keys.push('missing:' + o.id);
    if (f.dispatch_error) keys.push('dispatch:' + o.id);
  });
  return keys;
}

function checkAlerts() {
  const keys = alertKeys();
  const count = keys.length;
  ['sideAlertBadge', 'mobAlertBadge', 'botAlertBadge'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const txt = count > 99 ? '99+' : String(count);
    const changed = el.textContent !== txt;
    el.hidden = count === 0;
    el.textContent = txt;
    if (changed && count > 0) popEl(el);
  });
  const mobStatus = document.getElementById('mobStatusText');
  if (mobStatus) {
    mobStatus.textContent = count ? `Tofex · ${count} need action` : 'Tofex Kitchen · Live';
  }
  if (knownAlerts !== null) {
    const fresh = keys.filter(k => !knownAlerts.includes(k));
    if (fresh.length) {
      ringBell();
      if (soundOn) beep();
      notice(fresh.length + (fresh.length > 1 ? ' new items need' : ' new item needs') + ' your attention.');
    }
  }
  knownAlerts = keys;
  document.title = (count ? '(' + count + ') ' : '') + 'Tofex Operations';
}

load();
setInterval(() => {
  if (page !== 'dashboard' && page !== 'orders') return;
  if (document.querySelector('.modal-overlay')) return;
  const a = document.activeElement;
  if (a && a.matches && a.matches('input,select,textarea')) return;
  load();
}, 15000);
