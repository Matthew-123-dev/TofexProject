<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tofex operations</title>
  <style>
    :root{--bg:#f7f3ed;--ink:#292321;--muted:#766d66;--line:#e8dfd5;--panel:#fffdf9;--dark:#211d1d;--accent:#a9493d;--coral:#ef8064;--green:#26734d;--yellow:#a36116;--shadow:0 12px 30px #3320180d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{padding:30px 18px;background:var(--dark);color:#f8efe7;display:flex;flex-direction:column}.logo{font:700 26px Georgia,serif}.eyebrow{margin-top:4px;color:#c4ada0;font-size:12px;letter-spacing:.14em;text-transform:uppercase}nav{display:grid;gap:5px;margin-top:52px}nav a{padding:12px 14px;border-radius:10px;color:#c5b8b0}nav a:hover,nav a.active{background:#ffffff12;color:#fff}nav a.active{box-shadow:inset 3px 0 var(--coral)}.logout{margin-top:auto;border:1px solid #ffffff24;background:transparent;color:#d8c9c1;border-radius:9px;padding:10px;cursor:pointer}main{width:min(1260px,100%);padding:42px 46px}.topbar{display:flex;align-items:start;justify-content:space-between;gap:20px}.topbar h1{margin:6px 0 8px;font:700 38px Georgia,serif}.muted{color:var(--muted)}.eyebrow-light{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.stats,.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin:32px 0}.panel,.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.stat strong{display:block;margin-top:8px;font-size:27px}.section{margin-top:34px}.section-head,.card-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section h2{margin:0 0 6px;font:700 25px Georgia,serif}.grid{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}.menu-category{margin-top:24px}.menu-category h3{margin:0 0 11px;color:var(--accent);font-size:16px}.menu-row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.menu-row:last-child{border:0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#f9eadf;color:var(--yellow);font-size:12px;font-weight:750}.badge.green{background:#e4f3e9;color:var(--green)}.badge.red{background:#fbe5e2;color:#9b3328}.price{font-weight:750;white-space:nowrap}button,.button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font:700 14px system-ui}.primary{background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--panel);color:var(--ink)}.danger{border:1px solid #f0c8c2;background:#fff;color:#9b3328}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}label{display:grid;gap:6px;color:var(--muted);font-size:13px;font-weight:700}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}.notice{margin:20px 0;padding:12px 14px;border-radius:10px;background:#e5f5eb;color:var(--green)}.notice.error{background:#fbe5e2;color:#9b3328}.empty{padding:25px 0;color:var(--muted)}.order-items{margin:14px 0;padding-left:18px;color:var(--muted)}@media(max-width:820px){.shell{display:block}aside{padding:20px 18px}nav{display:flex;overflow:auto;margin-top:24px}nav a{white-space:nowrap}.logout{margin-top:18px}main{padding:27px 18px}.topbar h1{font-size:31px}.stats{grid-template-columns:repeat(2,1fr)}}
    .modal-overlay{position:fixed;inset:0;background:#191512b3;display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s ease}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:18px;box-shadow:0 30px 80px #0006;padding:26px;animation:pop .18s ease}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-head h3{margin:0;font:700 22px Georgia,serif}.icon-btn{background:transparent;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px;cursor:pointer;border-radius:8px}.icon-btn:hover{background:var(--bg);color:var(--ink)}.modal-actions{margin-top:18px;grid-column:1/-1}.checkbox-label{display:flex!important;flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600}.checkbox-label input{width:auto}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
    nav a{display:flex;align-items:center;gap:10px;transition:background-color .15s ease,color .15s ease}.nav-ic{font-size:16px;line-height:1}.logout{transition:background-color .15s ease,border-color .15s ease}.logout:hover{background:#ffffff14;border-color:#ffffff40}.panel,.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-3px);box-shadow:0 18px 42px #33201816}button,.button{transition:filter .15s ease,transform .1s ease}button:hover,.button:hover{filter:brightness(1.06)}button:active,.button:active{transform:scale(.97)}.primary:hover{box-shadow:0 10px 24px #a9493d40}.empty{border:1.5px dashed var(--line);border-radius:14px;text-align:center;background:#fffdf9}.menu-row{transition:background-color .15s ease}.menu-row:hover{background:#faf5ee}input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #a9493d22}.section{animation:fade .25s ease}
  </style>
</head>
<body><div class="shell"><aside><a class="logo" href="/dashboard">Tofex</a><div class="eyebrow">Restaurant operations</div><nav><a data-page="dashboard" href="/dashboard"><span class="nav-ic">📊</span>Overview</a><a data-page="menu" href="/manage-menu"><span class="nav-ic">🍽️</span>Manage menu</a><a data-page="orders" href="/orders"><span class="nav-ic">🧾</span>Orders</a><a data-page="riders" href="/riders"><span class="nav-ic">🛵</span>Riders</a><a data-page="areas" href="/delivery-areas"><span class="nav-ic">📍</span>Delivery areas</a></nav><form method="post" action="/logout"><button class="logout">Sign out</button></form></aside><main><div id="notice" hidden></div><div id="app"></div></main><div id="modalRoot"></div></div>
<script>
let data={items:[],orders:[],riders:[],areas:[]};const page=location.pathname==='/manage-menu'?'menu':location.pathname==='/orders'?'orders':location.pathname==='/riders'?'riders':location.pathname==='/delivery-areas'?'areas':'dashboard';document.querySelector(`[data-page="${page}"]`).classList.add('active');
const money=v=>`₦${Number(v).toLocaleString('en-NG')}`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),request=async(url,opt={})=>{const r=await fetch(url,opt);if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail||'Request failed')}return r.status===204?null:r.json()},notice=(t,error=false)=>{const n=document.querySelector('#notice');n.hidden=false;n.className=`notice${error?' error':''}`;n.textContent=t;setTimeout(()=>n.hidden=true,3500)};
const active=o=>!['delivered','collected','cancelled','failed'].includes(o.fulfillment?.stage)&&o.status!=='cancelled';
const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
async function load(){try{const [items,orders,riders,areas]=await Promise.all([request('/api/staff/menu'),request('/api/staff/orders'),request('/api/staff/riders'),request('/api/staff/delivery-areas')]);data={items,orders,riders,areas};render()}catch(e){notice(e.message,true)}}
function layout(title,subtitle,body){return `<header class="topbar"><div><div class="eyebrow-light">Tofex operations</div><h1>${title}</h1><p class="muted">${subtitle}</p></div></header>${body}`}
function menuPreview(full=false){const groups={};data.items.forEach(i=>(groups[i.category]??=[]).push(i));return Object.entries(groups).map(([cat,items])=>`<div class="menu-category"><h3>${esc(cat)}</h3>${(full?items:items.slice(0,3)).map(i=>`<div class="menu-row"><div><strong>${esc(i.name)}</strong><div class="muted">${esc(i.description||'No description')} · ${i.is_available?'Available':'Hidden'} · stock ${i.stock_quantity??'untracked'}</div></div><span class="price">${money(i.price)} ${full?`<button class="secondary" onclick="editMenu(${i.id})">Edit</button>`:''}</span></div>`).join('')}${!full&&items.length>3?'<div class="muted">+'+(items.length-3)+' more in this category</div>':''}</div>`).join('')||'<div class="empty">No menu items yet.</div>'}
function orderCard(o){const f=o.fulfillment||{},stage=f.stage||o.status;return `<article class="card"><div class="card-head"><div><strong>Order #${o.id}</strong><div class="muted">${esc(o.customer)} · ${esc(o.phone_number)}</div></div><span class="badge ${active(o)?'green':'red'}">${esc(stage.replaceAll('_',' '))}</span></div><p><strong>${money(o.total_amount)}</strong> · ${new Date(o.created_at).toLocaleString()}</p><ul class="order-items">${o.orders.flatMap(x=>x.items).map(i=>`<li>${i.quantity} × ${esc(i.name)}</li>`).join('')}</ul>${actions(o)}</article>`}
function actions(o){const f=o.fulfillment||{},opts=data.riders.filter(r=>r.is_active).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');if(o.status==='pending')return `<div class="actions"><button class="danger" onclick="review(${o.id},'reject')">Reject</button><button class="primary" onclick="review(${o.id},'approve')">Approve</button></div>`;if(f.stage==='awaiting_fee_quote')return `<div class="actions"><span class="muted">Customer typed a custom area: "${esc(f.area_name||'')}"</span><button class="primary" onclick="quoteModal(${o.id},${JSON.stringify(f.area_name||'')})">Send quote</button></div>`;if(f.stage==='awaiting_fee_accept')return `<span class="muted">Quote sent · awaiting customer response</span>`;if(f.stage==='preparing')return `<button class="primary" onclick="postAction(${o.id},'ready')">Mark ready</button>`;if(f.stage==='ready'&&f.type==='delivery')return `<div class="actions"><select id="r${o.id}"><option value="">Choose rider</option>${opts}</select><button class="primary" onclick="dispatch(${o.id})">Dispatch</button></div>`;if(f.stage==='ready'&&f.type==='pickup')return `<button class="primary" onclick="postAction(${o.id},'collected')">Collected</button>`;return ''}
function render(){const pending=data.orders.filter(o=>o.status==='pending').length,sorted=[...data.orders].sort((a,b)=>Number(active(b))-Number(active(a))||new Date(b.created_at)-new Date(a.created_at));if(page==='dashboard')document.querySelector('#app').innerHTML=layout(greeting(),'A clear view of what needs attention today.',`<div class="stats"><div class="panel stat"><span class="muted">Menu items</span><strong>${data.items.length}</strong></div><div class="panel stat"><span class="muted">Available now</span><strong>${data.items.filter(i=>i.is_available).length}</strong></div><div class="panel stat"><span class="muted">Pending orders</span><strong>${pending}</strong></div><div class="panel stat"><span class="muted">Last sync</span><strong>${new Date().toLocaleTimeString()}</strong></div></div><section class="section"><div class="section-head"><div><h2>Menu snapshot</h2><p class="muted">Three items per category, with the full catalogue one click away.</p></div><a class="button primary" href="/manage-menu">More · manage menu</a></div><div class="panel">${menuPreview()}</div></section><section class="section"><div class="section-head"><div><h2>Active orders</h2><p class="muted">The five most recent active orders are prioritised here.</p></div><a class="button secondary" href="/orders">More · all orders</a></div><div class="grid">${sorted.filter(active).slice(0,5).map(orderCard).join('')||'<div class="empty">No active orders.</div>'}</div></section><section class="section"><div class="section-head"><div><h2>Riders</h2><p class="muted">Your latest delivery partners.</p></div><a class="button secondary" href="/riders">More · riders</a></div><div class="grid">${data.riders.slice(0,5).map(riderCard).join('')||'<div class="empty">No riders yet.</div>'}</div></section><section class="section"><div class="section-head"><div><h2>Delivery areas</h2><p class="muted">Active service areas and their fees.</p></div><a class="button secondary" href="/delivery-areas">More · delivery areas</a></div><div class="grid">${data.areas.slice(0,5).map(areaCard).join('')||'<div class="empty">No delivery areas yet.</div>'}</div></section>`);if(page==='menu')document.querySelector('#app').innerHTML=layout('Manage menu','Keep your catalogue fresh, available, and easy to order.',`<div class="section-head"><h2>All menu items</h2><button class="primary" onclick="addMenu()">Add item</button></div><div class="panel">${menuPreview(true)}</div>`);if(page==='orders')document.querySelector('#app').innerHTML=layout('Orders','Active orders lead the queue; completed orders remain available below.',`<div class="grid">${sorted.map(orderCard).join('')||'<div class="empty">No orders yet.</div>'}</div>`);if(page==='riders')document.querySelector('#app').innerHTML=layout('Riders','Add delivery partners and keep their availability current.',`<form class="panel form-grid" onsubmit="saveRider(event)"><label>Name<input id="riderName" required maxlength="120"></label><label>Phone<input id="riderPhone" required></label><button class="primary">Add rider</button></form><div class="grid section">${data.riders.map(riderCard).join('')||'<div class="empty">No riders yet.</div>'}</div>`);if(page==='areas')document.querySelector('#app').innerHTML=layout('Delivery areas','Control where you deliver, the fee, and the expected wait.',`<form class="panel form-grid" onsubmit="saveArea(event)"><label>Name<input id="areaName" required maxlength="24"></label><label>Fee (₦)<input id="areaFee" required type="number" min="0" step=".01"></label><label>Minutes<input id="areaMinutes" required type="number" min="1" max="1440"></label><label>Sort order<input id="areaSort" required type="number" min="0" value="0"></label><button class="primary">Add area</button></form><div class="grid section">${data.areas.map(areaCard).join('')||'<div class="empty">No delivery areas yet.</div>'}</div>`)}
function riderCard(r){return `<article class="card"><div class="card-head"><strong>${esc(r.name)}</strong><span class="badge ${r.available?'green':''}">${r.available?'Available':r.is_active?'Active':'Inactive'}</span></div><p class="muted">${esc(r.phone_number)}</p>${r.is_archived?'':'<button class="danger" onclick="archiveRider('+r.id+')">Archive</button>'}</article>`}function areaCard(a){return `<article class="card"><div class="card-head"><strong>${esc(a.name)}</strong><span class="badge ${a.is_active?'green':'red'}">${a.is_active?'Active':'Disabled'}</span></div><p>${money(a.fee)} · about ${a.expected_minutes} minutes</p><div class="actions"><button class="secondary" onclick="editArea(${a.id})">Edit</button><button class="secondary" onclick="toggleArea(${a.id},${!a.is_active})">${a.is_active?'Disable':'Enable'}</button></div></article>`}
function openModal(title,bodyHtml){document.querySelector('#modalRoot').innerHTML=`<div class="modal-overlay" onmousedown="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" onclick="closeModal()" aria-label="Close">&times;</button></div><div class="modal-body">${bodyHtml}</div></div></div>`}
function closeModal(){document.querySelector('#modalRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function confirmModal(title,message,confirmLabel='Confirm',danger=false){return new Promise(resolve=>{openModal(title,`<p class="muted">${esc(message)}</p><div class="actions modal-actions"><button type="button" class="secondary" id="modalCancel">Cancel</button><button type="button" class="${danger?'danger':'primary'}" id="modalConfirm">${esc(confirmLabel)}</button></div>`);document.querySelector('#modalCancel').onclick=()=>{closeModal();resolve(false)};document.querySelector('#modalConfirm').onclick=()=>{closeModal();resolve(true)}})}
function menuFormModal(item=null){const categories=[...new Set(data.items.map(i=>i.category))];openModal(item?'Edit menu item':'Add menu item',`<form id="menuForm" class="form-grid"><label>Name<input id="mfName" required maxlength="120" value="${esc(item?.name||'')}"></label><label>Category<input id="mfCategory" required maxlength="60" list="categoryList" value="${esc(item?.category||'')}"></label><datalist id="categoryList">${categories.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>Price (₦)<input id="mfPrice" type="number" min="0" step=".01" required value="${item?.price??''}"></label><label>Stock qty (blank = untracked)<input id="mfStock" type="number" min="0" value="${item?.stock_quantity??''}"></label><label>Low stock alert<input id="mfLow" type="number" min="0" value="${item?.low_stock_threshold??0}"></label><label>Description<input id="mfDesc" maxlength="500" value="${esc(item?.description||'')}"></label><label class="checkbox-label"><input id="mfAvailable" type="checkbox" ${(item?item.is_available:true)?'checked':''}> Available for ordering</label><div class="actions modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">${item?'Save changes':'Add item'}</button></div></form>`);document.querySelector('#menuForm').onsubmit=async e=>{e.preventDefault();const stockRaw=mfStock.value,payload={name:mfName.value,category:mfCategory.value,price:Number(mfPrice.value),description:mfDesc.value||null,stock_quantity:stockRaw===''?null:Number(stockRaw),low_stock_threshold:Number(mfLow.value||0),is_available:mfAvailable.checked};try{if(item)await request(`/api/staff/menu/${item.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});else await request('/api/staff/menu',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});closeModal();notice(item?'Menu item updated.':'Menu item added.');load()}catch(x){notice(x.message,true)}}}
function areaFormModal(area){openModal('Edit delivery area',`<form id="areaForm" class="form-grid"><label>Name<input id="afName" required maxlength="24" value="${esc(area.name)}"></label><label>Fee (₦)<input id="afFee" required type="number" min="0" step=".01" value="${area.fee}"></label><label>Minutes<input id="afMinutes" required type="number" min="1" max="1440" value="${area.expected_minutes}"></label><label>Sort order<input id="afSort" required type="number" min="0" value="${area.sort_order}"></label><label class="checkbox-label"><input id="afActive" type="checkbox" ${area.is_active?'checked':''}> Active</label><div class="actions modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save changes</button></div></form>`);document.querySelector('#areaForm').onsubmit=async e=>{e.preventDefault();const payload={name:afName.value,fee:Number(afFee.value),expected_minutes:Number(afMinutes.value),sort_order:Number(afSort.value),is_active:afActive.checked};try{await request(`/api/staff/delivery-areas/${area.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});closeModal();notice('Delivery area updated.');load()}catch(x){notice(x.message,true)}}}
function quoteModal(id,areaName){openModal('Send delivery fee quote',`<p class="muted">The customer typed a custom area: "${esc(areaName)}". Enter the delivery fee to quote them.</p><form id="quoteForm" class="form-grid"><label>Fee (₦)<input id="qFee" required type="number" min="0" step=".01" autofocus></label><div class="actions modal-actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Send quote</button></div></form>`);document.querySelector('#quoteForm').onsubmit=async e=>{e.preventDefault();try{await request(`/api/staff/orders/${id}/quote`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fee:Number(qFee.value)})});closeModal();notice('Quote sent to customer.');load()}catch(x){notice(x.message,true)}}}
function editArea(id){const a=data.areas.find(x=>x.id===id);if(a)areaFormModal(a)}
async function postAction(id,action){try{await request(`/api/staff/orders/${id}/${action}`,{method:'POST'});notice('Order updated.');load()}catch(e){notice(e.message,true)}}async function review(id,a){const ok=await confirmModal(a==='approve'?'Approve order':'Reject order',`Are you sure you want to ${a} order #${id}?`,a==='approve'?'Approve':'Reject',a==='reject');if(ok)postAction(id,a)}async function dispatch(id){const riderId=Number(document.querySelector('#r'+id).value);if(!riderId)return notice('Choose a rider first.',true);try{await request(`/api/staff/orders/${id}/dispatch`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rider_id:riderId})});notice('Order dispatched.');load()}catch(e){notice(e.message,true)}}async function archiveRider(id){const ok=await confirmModal('Archive rider','This rider will no longer be available for new dispatches. Continue?','Archive',true);if(!ok)return;try{await request(`/api/staff/riders/${id}/archive`,{method:'POST'});notice('Rider archived.');load()}catch(e){notice(e.message,true)}}async function saveRider(e){e.preventDefault();try{await request('/api/staff/riders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:riderName.value,phone_number:riderPhone.value,is_active:false})});notice('Rider added.');load()}catch(x){notice(x.message,true)}}async function toggleArea(id,is_active){const a=data.areas.find(x=>x.id===id);try{await request(`/api/staff/delivery-areas/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({...a,is_active})});load()}catch(e){notice(e.message,true)}}async function saveArea(e){e.preventDefault();try{await request('/api/staff/delivery-areas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:areaName.value,fee:Number(areaFee.value),expected_minutes:Number(areaMinutes.value),sort_order:Number(areaSort.value),is_active:true})});notice('Area added.');load()}catch(x){notice(x.message,true)}}function addMenu(){menuFormModal()}function editMenu(id){const i=data.items.find(x=>x.id===id);if(i)menuFormModal(i)}load();
</script></body></html>
